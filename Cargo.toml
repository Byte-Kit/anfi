[package]
name = "anfi"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "uuid", "migrate"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.21"
